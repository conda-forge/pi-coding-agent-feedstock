context:
  name: pi-coding-agent
  version: "1.7.0"

package:
  name: pi-coding-agent
  version: ${{ version }}

source:
  - url: https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-${{ version }}.tgz
    sha256: cb031ff39b75d042797d748033987dd9c0e567373397172c0b4ed661d0bf4824
  - url: https://raw.githubusercontent.com/earendil-works/pi/main/LICENSE
    sha256: 4780a6e9d4b2213784027092b8f305d49059728495fab1ddb93f3c6fb8b283c7
    file_name: LICENSE

build:
  number: 0
  script:
    file: build
    env:
      # Exposed so build.bat can select the target arch's native prebuilts when
      # cross-compiling win-arm64 on a win-64 runner.
      target_platform: ${{ target_platform }}
  dynamic_linking:
    binary_relocation: false
  skip:
    - ppc64le

requirements:
  build:
    - pnpm
    - pnpm-licenses
    - nodejs
  run:
    - nodejs >=22.19.0

tests:
  - requirements:
      run:
        - nodejs
    script:
      - pi --help

about:
  summary: Coding agent CLI with read, bash, edit, write tools and session management
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  homepage: https://github.com/earendil-works/pi
  repository: https://github.com/earendil-works/pi

extra:
  feedstock-name: pi-coding-agent
  recipe-maintainers:
    - xhochy
    - moritzwilksch
    - janjagusch
